<!doctype html><meta charset="utf-8"><title>ModOS · Vision Pro</title>
<!-- The Vision Pro app's editor: the main page's Demo, the editor in Vision Pro mode (src/vision-panel.mjs), on the space's first recording. -->
<script type="module">
const space=new URLSearchParams(location.search).get('space')||'atlas';
const list=await fetch('/api/spaces').then(r=>r.json()),take=list.spaces.find(s=>s.name===space)?.scenarios[0];
location.replace(`../../${take?`?${new URLSearchParams({session:take.session,vision:'1'})}`:''}#demo`);
</script>
