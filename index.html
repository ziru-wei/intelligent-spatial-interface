<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The project's main page: Demo (ModOS itself, live: the editor served by system/editor), Gallery (the recordings) and Document
   (Spatial vocabulary; Memory, Walkthrough… to come). Light; neutral greys only (cyan belongs to the spatial UI, not to this page). Helvetica
   light; bold only where the text matters most. Document: centred, one row per group; Gallery: a masonry of MODs. */
:root{--bg:#fbfbfa;--card:#f0f0ee;--card-hi:#e7e7e4;--line:rgba(0,0,0,.08);--fg:#16171a;--muted:#5f636a;--faint:#9a9ea5;--rule:rgba(0,0,0,.16);
  --pill:rgba(255,255,255,.97);--on:#16171a;--on-ink:#fbfbfa;--font:"Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
[hidden]{display:none!important}
main{padding:16px 0 120px}
.pad{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
/* category tabs (Document) */
.tabs{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:28px;padding-top:12px;padding-bottom:10px;margin-bottom:4px;background:linear-gradient(var(--bg) 70%,rgba(251,251,250,0))}
.tabs button{font:300 28px/1.1 var(--font);color:var(--faint);background:none;border:0;padding:0;cursor:pointer;letter-spacing:-.01em}
.tabs button:hover{color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700;box-shadow:inset 0 -1.5px 0 var(--fg);padding-bottom:6px}
.tabs button{padding-bottom:6px}
.lead{margin:0 auto 20px;color:var(--muted);max-width:60ch}
/* Document: everything centred; a row is its name and what it is for, then its parts side by side (sideways when they do not fit) */
#vocabulary,#about{text-align:center}
.row{margin:0 0 22px}
.group{margin:0 0 40px}
.group-head{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
.group-head h2{font:700 24px/1.15 var(--font);margin:0;letter-spacing:-.01em}
.group-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.row-head{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:10px}
.row-head h3{font:700 15px/1.2 var(--font);margin:0}
.row-head p{margin:0;color:var(--muted);font-size:14px}
.strip{display:flex;justify-content:safe center;gap:28px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 24px;padding-bottom:6px;scrollbar-width:none;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.strip>*{scroll-snap-align:center;flex:0 0 auto}
/* Gallery: a masonry of MODs. A MOD is its icon and name, a thin line down its left joining it to its clips; a clip is its question
   above the camera view (the recording's left 3/4: the pipeline beside it is not shown here). */
.masonry{columns:3 340px;column-gap:28px}
.mod{break-inside:avoid;margin:0 0 30px;position:relative;padding-left:26px;display:grid;gap:14px}
.mod::before{content:"";position:absolute;left:8px;top:26px;bottom:6px;width:1px;background:var(--rule)}
.mod h2{font:700 17px/1.2 var(--font);margin:0 0 0 -26px;display:flex;align-items:center;gap:9px}
.mod h2 svg,.mod h2 i{width:17px;height:17px;flex:none;stroke-width:1.75}
.mod h2 .n{font-weight:300;color:var(--faint);font-size:13px}
.clip{position:relative}
.clip::before{content:"";position:absolute;left:-18px;top:.75em;width:12px;height:1px;background:var(--rule)}
.clip .q{display:block;font:300 15px/1.35 var(--font);color:var(--fg);margin:0 0 7px}
.cam{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:#000}
.cam img,.cam video{position:absolute;left:0;top:0;height:100%;width:133.6%;max-width:none;object-fit:cover;object-position:left center;display:block}
/* quiet until looked at: every MOD dim; the one under the pointer brighter; the clip under it whole, and playing */
@media (hover:hover){
  .mod>*{opacity:.42;transition:opacity .2s}
  .mod:hover>*{opacity:.75}
  .mod:hover>.clip:hover{opacity:1}
}
.dlg-cam{aspect-ratio:4/3;max-height:88vh;margin:0 auto;border-radius:14px}
/* cards */
.part{width:min(220px,70vw);margin:0}
.part img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;cursor:zoom-in}
.part figcaption{padding:7px 2px 0}
.part b{display:block;font-size:15px;margin-bottom:3px}
.part p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}
.part i{font-style:normal;color:var(--faint);font-size:12.5px}
.clip{width:100%;display:block;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.clip span{display:block;padding:10px 14px 12px;color:var(--muted);font-size:13px}
.clip span b{color:var(--fg)}
/* the floating switch */
.bar{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;justify-items:center;gap:8px;z-index:10;max-width:calc(100vw - 32px)}
.switch{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--pill);box-shadow:0 8px 28px rgba(0,0,0,.12),inset 0 0 0 1px var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:100%;overflow-x:auto}
.switch button{font:300 14px var(--font);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.switch button:hover{color:var(--fg)}
.switch button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);font-weight:700}
.switch.sub button{font-size:13px;padding:7px 14px}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* Demo frames the editor, which stays dark: its own page */
dialog{border:0;padding:0;background:transparent;max-width:min(1100px,94vw,117vh);width:100%}
dialog::backdrop{background:rgba(5,6,8,.92)}
dialog video,dialog img{display:block;width:100%;border-radius:14px;background:#000}
.close{position:absolute;top:12px;right:12px;font:300 13px var(--font);color:#f1f2f4;background:rgba(20,22,26,.8);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
/* Demo is ModOS itself, the whole window, in its own dark */
body.dark{background:#111111}
body.dark .switch{background:rgba(28,30,34,.97);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08)}
body.dark .switch button{color:#9ea3ab}
body.dark .switch button:hover{color:#f1f2f4}
body.dark .switch button[aria-pressed="true"]{background:#f1f2f4;color:#111111}
#demo{padding:0}
#demo iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111111}
#demo p{margin:40px 24px;color:#9ea3ab}#demo code{color:#e8e8e8}
#demo p{color:var(--muted)}

#demo code{font:400 14px ui-monospace,Menlo,monospace;color:var(--fg)}
@media (max-width:600px){.tabs{gap:18px}.tabs button{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<main>
  <section id="demo" class="pad" aria-label="Demo" hidden></section>
  <section id="gallery" aria-label="Gallery" hidden><p class="pad">Loading…</p></section>
  <section id="vocabulary" aria-label="Vocabulary" hidden></section>
  <section id="about" aria-label="About" hidden></section>
</main>
<div class="bar">
  <nav class="switch" id="nav" aria-label="Section"><button type="button" data-tab="demo" aria-pressed="true">Demo</button><button type="button" data-tab="gallery" aria-pressed="false">Gallery</button><button type="button" data-tab="vocabulary" aria-pressed="false">Vocabulary</button><button type="button" data-tab="about" aria-pressed="false">About</button></nav>
</div>
<dialog id="dlg" aria-label="Recording"><div class="cam dlg-cam"><video id="vid" controls playsinline preload="metadata"></video></div><button class="close" type="button" data-close>Close</button></dialog>
<dialog id="zoom" aria-label="Image"><img alt=""><button class="close" type="button" data-close>Close</button></dialog>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="context/recordings/manifest.js"></script>
<script>
const REC='context/recordings/';   // the recordings and their manifest (system/editor/demos/record.mjs writes them)
const MODS=["Weather", "FindMy", "WorldInfo", "LabInfo", "IoTControl", "ObjectStatus", "Wayfinding", "Delegate", "Agenda", "BookCompanion", "StepGuide", "LiveCoach", "Reminder"];
// Spatial vocabulary (context/docs/modos-system-design.md 4.4): category → row → part
const CATS=[{"id": "cues", "name": "Cues", "def": "Drawn on the room itself.", "rows": [{"name": "Mark", "def": "highlighting a physical entity", "items": [{"img": "breathingBox", "name": "Breathing Box", "use": "Draws the eye to a thing.", "eg": "FindMy"}, {"img": "cornerBrackets", "name": "Corner Brackets", "use": "Marks a thing without covering its content.", "eg": "WorldInfo"}, {"img": "footprintRing", "name": "Footprint Ring", "use": "Shows which thing is being operated.", "eg": "IoTControl"}, {"img": "floorArea", "name": "Floor Area", "use": "Shows a room or area; a place has no box.", "eg": "LabInfo"}, {"img": "doorwayGlow", "name": "Doorway Glow", "use": "Shows where to enter another room.", "eg": "Wayfinding"}]}, {"name": "Guidance", "def": "leading to somewhere", "items": [{"img": "arrowAhead", "name": "Arrow Ahead", "use": "Turns you toward a target in this room.", "eg": "FindMy"}, {"img": "floorPath", "name": "Floor Path", "use": "Leads along a route to another room.", "eg": "Wayfinding"}, {"img": "textArrow", "name": "Text Arrow", "use": "Links text to the thing it is about.", "eg": "WorldInfo"}]}, {"name": "Visualization", "def": "visualizing information", "items": [{"img": "haloDial", "name": "Gauge", "use": "How much: a level with a range.", "eg": "IoTControl"}, {"img": "progressRail", "name": "Progress Rail", "use": "A task’s progress and time left.", "eg": "IoTControl"}, {"img": "pinnedTags", "name": "Pinned Tags", "use": "Several readings of one thing.", "eg": "IoTControl"}, {"img": "statusPulse", "name": "Status Pulse", "use": "A state, and why.", "eg": "ObjectStatus"}, {"img": "cardStack", "name": "Card Stack", "use": "What waits in line.", "eg": "IoTControl"}]}, {"name": "Controls", "def": "what the user acts on", "rows": [{"name": "Adjust", "def": "changes the thing; sent", "items": [{"img": "edgeBar", "name": "Slider", "use": "Sets a level; sent on release.", "eg": "IoTControl"}, {"img": "edgeTabs", "name": "Edge Tabs", "use": "Picks one of a few options.", "eg": "IoTControl"}, {"img": "iconButton", "name": "Icon Button", "use": "Switches or triggers in one press.", "eg": "IoTControl"}, {"img": "textButton", "name": "Text Button", "use": "A command no preset fits.", "eg": "IoTControl"}]}, {"name": "Explore", "def": "moves through information", "items": [{"img": "datePicker", "name": "Date Picker", "use": "Moves between days.", "eg": "Weather"}, {"img": "playback", "name": "Playback", "use": "Plays through time, or scrubs.", "eg": "Weather"}]}, {"name": "Interactive", "def": "reaches a person", "items": [{"img": "contactChip", "name": "Contact Chip", "use": "Who it goes to.", "eg": "Delegate"}, {"img": "textInput", "name": "Text Input", "use": "What is said; tap to edit.", "eg": "Delegate"}, {"img": "tetherSend", "name": "Tether Send", "use": "What goes, and to whom.", "eg": "Delegate"}, {"img": "photoCapture", "name": "Photo Capture", "use": "A photo of the thing, sent along.", "eg": "Delegate"}]}]}]}, {"id": "text", "name": "Text", "def": "How the words appear.", "rows": [{"name": "", "def": "one per answer, by rule", "items": [{"img": "embeddedText", "name": "Embedded Text", "use": "Written on a surface that reads well.", "eg": "Weather"}, {"img": "floatingText", "name": "Floating Text", "use": "Beside its anchor when no surface fits.", "eg": "IoTControl"}, {"img": "dialogue", "name": "Object-centric Dialogue", "use": "The thing answers, when asked as “you”.", "eg": "WorldInfo"}]}]}, {"id": "assets", "name": "Assets", "def": "A MOD’s own; not shared.", "rows": [{"name": "", "def": "", "items": [{"img": "ambientEffect", "name": "Ambient Asset", "use": "The data as part of the room: sky, rain, fog.", "eg": "Weather"}, {"img": "asset", "name": "Scene Asset", "use": "A prepared model or animation, in place.", "eg": "LabInfo"}]}]}];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
// A part: its picture, name and one line.
const part=i=>`<figure class="part"><img src="${REC}cues/${esc(i.img)}.jpg" alt="${esc(i.name)} in the room" loading="lazy" data-zoom><figcaption><b>${esc(i.name)}</b><p>${esc(i.use)}</p></figcaption></figure>`;
// A group of a category (Mark, Guidance, Visualization, Controls…): a large heading, then its parts, or its own rows (Controls: Adjust,
// Explore, Interactive) under smaller headings.
const group=g=>g.rows?`<section class="group"><div class="group-head pad"><h2>${esc(g.name)}</h2>${g.def?`<p>${esc(g.def)}</p>`:''}</div>${g.rows.map(r=>row(r.name,r.def,r.items.map(part))).join('')}</section>`
  :g.name?`<section class="group"><div class="group-head pad"><h2>${esc(g.name)}</h2>${g.def?`<p>${esc(g.def)}</p>`:''}</div><div class="strip pad">${g.items.map(part).join('')}</div></section>`
  :row('',g.def,g.items.map(part));
// One row: its name and what it is for, then its parts side by side.
const row=(name,def,cards)=>`<section class="row"><div class="row-head pad">${name?`<h3>${esc(name)}</h3>`:''}${def?`<p>${esc(def)}</p>`:''}</div><div class="strip pad">${cards.join('')}</div></section>`;
function wireRows(root){for(const i of root.querySelectorAll('[data-zoom]'))i.onclick=()=>{$('zoom').querySelector('img').src=i.src;$('zoom').showModal();};}
// Sections with tabs at their top (Vocabulary: its categories; About: Memory, Decisions…): a tab is an id, a name and what it renders.
const tabsBar=(sec,list,on)=>`<nav class="tabs pad" role="tablist" aria-label="${sec}">${list.map(x=>`<button type="button" role="tab" data-sub="${x.id}" aria-selected="${x.id===on}">${esc(x.name)}</button>`).join('')}</nav>`;
const SUBS={
  vocabulary:CATS.map(c=>({id:c.id,name:c.name,render:()=>`<p class="lead pad">${esc(c.def)}</p>${c.rows.map(group).join('')}`})),
  // About: to be written (left empty on purpose)
  about:[{id:'memory',name:'Memory',render:()=>''},{id:'decisions',name:'Decisions',render:()=>''},{id:'walkthrough',name:'Walkthrough',render:()=>''}],
};
const TABS=['demo','gallery','vocabulary','about'];
let tab='demo';const sub={vocabulary:SUBS.vocabulary[0].id,about:SUBS.about[0].id};
function route(){const [t,u]=location.hash.slice(1).split('/');tab=TABS.includes(t)?t:'demo';if(SUBS[tab]?.some(x=>x.id===u))sub[tab]=u;render();}
function go(t,u=sub[t]){location.hash=SUBS[t]?`${t}/${u}`:t;}
function render(){
  for(const b of $('nav').children)b.setAttribute('aria-pressed',String(b.dataset.tab===tab));
  for(const t of TABS)$(t).hidden=tab!==t;document.body.classList.toggle('dark',tab==='demo');if(tab==='demo')showDemo();
  if(SUBS[tab]){const el=$(tab),cur=SUBS[tab].find(x=>x.id===sub[tab]);el.innerHTML=tabsBar(tab,SUBS[tab],cur.id)+cur.render();
    for(const b of el.querySelectorAll('[data-sub]'))b.onclick=()=>go(tab,b.dataset.sub);wireRows(el);}
}
for(const b of $('nav').children)b.onclick=()=>go(b.dataset.tab);
addEventListener('hashchange',()=>{route();scrollTo(0,0);});
// Demo: ModOS itself, live (the editor and its API, system/editor: npm start), on the lab recording
const SYSTEM='http://127.0.0.1:8766/',SESSION='./spaces/atlas/scenarios/atlas_rec_5/session.json';
let demoShown=false;
async function showDemo(){
  if(demoShown)return;demoShown=true;
  try{await fetch(SYSTEM,{mode:'no-cors',cache:'no-store'});$('demo').innerHTML=`<iframe src="${SYSTEM}?session=${encodeURIComponent(SESSION)}" title="ModOS" allow="autoplay; fullscreen"></iframe>`;}
  catch{demoShown=false;$('demo').innerHTML=`<p>ModOS is not running. Start it with <code>cd system/editor && npm start</code>, then open Demo again.</p>`;}
}
// Gallery: a masonry of MODs (Lucide icon, name, how many; a line on the left to their clips). A clip is its question above the camera
// view; under the pointer it plays (muted), opened it is only the video.
const ICON={Weather:'cloud-sun',FindMy:'search',WorldInfo:'info',LabInfo:'flask-conical',IoTControl:'lightbulb',ObjectStatus:'activity',
  Wayfinding:'signpost',Delegate:'send',Agenda:'calendar',BookCompanion:'book-open',StepGuide:'list-ordered',LiveCoach:'person-standing',Reminder:'bell'};
function renderClips(clips){
  $('gallery').innerHTML=`<div class="masonry pad">${MODS.filter(m=>clips.some(c=>c.mod===m)).map(m=>{const own=clips.filter(c=>c.mod===m);
    return `<section class="mod"><h2><i data-lucide="${ICON[m]||'box'}" aria-hidden="true"></i>${esc(m)}<span class="n">${own.length}</span></h2>${own.map(c=>`<button class="clip" type="button" data-clip="${esc(c.name)}">
      <span class="q">“${esc(c.question)}”</span><span class="cam"><img src="${REC}${esc(c.poster)}" alt="" loading="lazy"></span></button>`).join('')}</section>`;}).join('')}</div>`;
  try{window.lucide?.createIcons({attrs:{'stroke-width':1.75}});}catch{}
  for(const b of document.querySelectorAll('[data-clip]')){const c=clips.find(x=>x.name===b.dataset.clip),cam=b.querySelector('.cam');let v=null;
    b.onclick=()=>{const d=$('vid');d.src=REC+c.video;d.poster=REC+c.poster;$('dlg').showModal();d.play().catch(()=>{});};
    if(matchMedia('(hover:hover)').matches){
      b.addEventListener('mouseenter',()=>{v=document.createElement('video');Object.assign(v,{src:REC+c.video,muted:true,loop:true,playsInline:true,poster:REC+c.poster});cam.append(v);v.play().catch(()=>{});});
      b.addEventListener('mouseleave',()=>{if(v){v.pause();v.removeAttribute('src');v.load();v.remove();v=null;}});}}
}
for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{if(e.target===d||e.target.dataset.close!==undefined)d.close();});
$('dlg').addEventListener('close',()=>{const v=$('vid');v.pause();v.removeAttribute('src');v.load();});
const load=window.MANIFEST?Promise.resolve(window.MANIFEST):fetch(REC+'manifest.json').then(r=>r.json());
load.then(m=>renderClips(Object.values(m.clips))).catch(()=>{$('gallery').innerHTML='<p class="pad">The recordings could not be loaded.</p>';});
route();
</script>
