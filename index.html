<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The project's main page, and the page the system opens (npm start in system/editor serves it): Demo (ModOS itself, live: the editor, system/editor, framed), Gallery (examples asked in ModOS: media/gallery) and Document
   (Spatial vocabulary; Memory, Walkthrough… to come). Light; neutral greys only (cyan belongs to the spatial UI, not to this page). Helvetica
   light; bold only where the text matters most. Document: centred, one row per group; Gallery: a masonry of MODs. */
:root{--q-hover:#24707a;--bg:#fbfbfa;--card:#f0f0ee;--card-hi:#e7e7e4;--line:rgba(0,0,0,.08);--fg:#16171a;--muted:#5f636a;--faint:#9a9ea5;--rule:rgba(0,0,0,.16);
  --pill:rgba(255,255,255,.72);--on:#16171a;--on-ink:#fbfbfa;--font:"Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
b,strong{font-weight:700}
[hidden]{display:none!important}
main{padding:16px 0 120px}
.pad{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
/* category tabs (Document) */
.tabs{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:28px;padding-top:12px;padding-bottom:10px;margin-bottom:4px;background:linear-gradient(var(--bg) 70%,rgba(251,251,250,0))}
.tabs button{font:300 28px/1.1 var(--font);color:var(--faint);background:none;border:0;padding:0;cursor:pointer;letter-spacing:-.01em}
.tabs button:hover{color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700;box-shadow:inset 0 -1.5px 0 var(--fg);padding-bottom:6px}
.tabs button{padding-bottom:6px}
.lead{margin:0 auto 20px;color:var(--muted);max-width:60ch}
/* Document: everything centred; a row is its name and what it is for, then its parts side by side (sideways when they do not fit) */
#vocabulary,#about{text-align:center}
.row{margin:0 0 22px}
.group{margin:0 0 40px}
.group-head{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
.group-head h2{font:700 24px/1.15 var(--font);margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.group-head h2 svg{width:22px;height:22px;flex:none}
/* rows inside a group: their names in a thin capsule */
.row-head h3{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:4px 14px;margin-bottom:4px}
/* Text and Assets have few parts: show them larger */
.cat-text .part,.cat-assets .part{width:min(360px,82vw)}
.group-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.row-head{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:10px}
.row-head h3{font:700 15px/1.2 var(--font);margin:0}
.row-head p{margin:0;color:var(--muted);font-size:14px}
.strip{display:flex;justify-content:safe center;gap:28px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 24px;padding-bottom:6px;scrollbar-width:none;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.strip>*{scroll-snap-align:center;flex:0 0 auto}
/* Gallery: a masonry of MODs. A MOD is its icon and name, a thin line down its left joining it to its clips; a clip is its question
   above the camera view (the recording's left 3/4: the pipeline beside it is not shown here). */
.masonry{columns:3 340px;column-gap:28px}
.mod{break-inside:avoid;margin:0 0 30px;position:relative;padding-left:26px;display:grid;gap:14px}
.mod::before{content:"";position:absolute;left:8px;top:26px;bottom:6px;width:1px;background:var(--rule)}
.mod h2{font:700 17px/1.2 var(--font);margin:0 0 0 -26px;display:flex;align-items:center;gap:9px}
.mod h2 svg,.mod h2 i{width:17px;height:17px;flex:none;stroke-width:1.75}
.mod h2 .n{font-weight:300;color:var(--faint);font-size:13px}
.clip{position:relative}
.clip::before{content:"";position:absolute;left:-18px;top:.75em;width:12px;height:1px;background:var(--rule)}
.clip .q{display:block;font:300 15px/1.35 var(--font);color:var(--fg);margin:0 0 7px;transition:color .2s}.clip:hover .q,.clip:focus-visible .q{color:var(--q-hover)}
.cam{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:#000}
.cam img{position:absolute;left:0;top:0;height:100%;width:100%;object-fit:cover;display:block}
/* quiet until looked at: every MOD dim; the one under the pointer brighter; the clip under it whole, and playing */
@media (hover:hover){
  .mod>*{opacity:.42;transition:opacity .2s}
  .mod:hover>*{opacity:.75}
  .mod:hover>.clip:hover{opacity:1}
}
/* cards */
.part{width:min(220px,70vw);margin:0}
.part .scene{display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;border-radius:10px;background:transparent;cursor:grab;box-shadow:inset 0 0 0 1px var(--line)}
.part .scene:hover{box-shadow:inset 0 0 0 1px var(--rule)}
.part .scene.off{background:var(--card);color:var(--faint);font:300 12px/1.4 var(--font);cursor:default}
/* a part opened: its scene, larger, to walk around (drag) and use */
#part{max-width:none;width:min(1280px,94vw);height:min(80vh,70vw)}
#part .view{width:100%;height:100%;border-radius:14px;overflow:hidden;background:#3b3d42}
#part figcaption{position:absolute;left:16px;bottom:14px;color:#f1f2f4;font:300 14px/1.4 var(--font);pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#part figcaption b{display:block;font-size:17px}
.part figcaption{padding:7px 2px 0}
.part b{display:block;font-size:15px;margin-bottom:3px}
.part p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}
.part i{font-style:normal;color:var(--faint);font-size:12.5px}
.clip{width:100%;display:block;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.clip span{display:block;padding:10px 14px 12px;color:var(--muted);font-size:13px}
.clip span b{color:var(--fg)}
/* the floating switch */
.bar{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;justify-items:center;gap:8px;z-index:10;max-width:calc(100vw - 32px)}
.switch{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--pill);box-shadow:0 8px 28px rgba(0,0,0,.12),inset 0 0 0 1px var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:100%;overflow-x:auto}
.switch button{font:300 14px var(--font);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.switch button:hover{color:var(--fg)}
.switch button[aria-pressed="true"]{background:var(--on);color:var(--on-ink);font-weight:700}
.switch.sub button{font-size:13px;padding:7px 14px}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
/* Demo frames the editor, which stays dark: its own page */
dialog{border:0;padding:0;background:transparent;max-width:min(1280px,94vw,150vh);width:100%}
dialog::backdrop{background:rgba(5,6,8,.92)}
dialog img{display:block;width:100%;border-radius:14px;background:#000}
#example{max-width:none;width:94vw;height:90vh}
#example iframe{display:block;width:100%;height:100%;border:0;border-radius:14px;background:#0b0c0e}
#example p{color:#ddd;font:300 15px/1.5 var(--font);padding:24px}
.close{position:absolute;top:12px;right:12px;font:300 13px var(--font);color:#f1f2f4;background:rgba(20,22,26,.8);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}.close.try{right:84px}
/* Demo is ModOS itself, the whole window, in its own dark */
body.dark{background:#111111}
body.demo-full .switch{display:none}body.dark .switch{background:rgba(28,30,34,.72);box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08)}
body.dark .switch button{color:#9ea3ab}
body.dark .switch button:hover{color:#f1f2f4}
body.dark .switch button[aria-pressed="true"]{background:#f1f2f4;color:#111111}
#demo{padding:0}
#demo iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#111111}
#demo p{margin:40px 24px;color:#9ea3ab}#demo code{color:#e8e8e8}
#demo p{color:var(--muted)}

#demo code,.walk code{font:400 14px ui-monospace,Menlo,monospace;color:var(--fg)}
/* About: ModOS, the introduction, a column of reading width; Walkthrough, the pipeline page flush from the tab row's line to the
   window's bottom, edge to edge (no frame) */
.intro{max-width:68ch;margin:28px auto 0;text-align:left;font-size:18px;line-height:1.6}
.intro p{margin:0 0 1em}
.walk{position:fixed;left:0;right:0;bottom:0;top:var(--walk-top,120px);background:#fff}
.walk iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.walk p{color:var(--muted);margin:40px 24px}
/* Walkthrough: the page white, as the pipeline page under its tabs */
body.walkthrough{--bg:#fff;background:#fff}
body.walkthrough .tabs{background:#fff}
@media (max-width:600px){.tabs{gap:18px}.tabs button{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* On the Demo, the switch steps out of ModOS's way: a ball in the bottom-right corner, opening leftward under the pointer; elsewhere
   it stands centred. The moves are smooth. */
.bar{width:max-content;transition:left .5s cubic-bezier(.2,.8,.2,1),transform .5s cubic-bezier(.2,.8,.2,1)}
.switch{transition:max-width .45s cubic-bezier(.2,.8,.2,1),background .3s,box-shadow .3s;position:relative}
.switch button{transition:background .15s,color .15s,opacity .25s}
body.dark .bar{left:calc(100% - 18px);transform:translateX(-100%)}
body.dark .switch{max-width:42px;height:42px;overflow:hidden}
body.dark .switch button{opacity:0;pointer-events:none}
body.dark .switch::before{content:"";position:absolute;top:50%;right:16px;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#f1f2f4;opacity:.8;transition:opacity .25s;pointer-events:none}
body.dark .bar:hover .switch,body.dark .switch:focus-within{max-width:440px}
body.dark .bar:hover .switch button,body.dark .switch:focus-within button{opacity:1;pointer-events:auto}
body.dark .bar:hover .switch::before,body.dark .switch:focus-within::before{opacity:0}
</style>
<main>
  <section id="demo" class="pad" aria-label="Demo" hidden></section>
  <section id="gallery" aria-label="Gallery" hidden><p class="pad">Loading…</p></section>
  <section id="vocabulary" aria-label="Vocabulary" hidden></section>
  <section id="about" aria-label="About" hidden></section>
</main>
<div class="bar">
  <nav class="switch" id="nav" aria-label="Section"><button type="button" data-tab="demo" aria-pressed="true">Demo</button><button type="button" data-tab="gallery" aria-pressed="false">Gallery</button><button type="button" data-tab="vocabulary" aria-pressed="false">Vocabulary</button><button type="button" data-tab="about" aria-pressed="false">About</button></nav>
</div>
<dialog id="example" aria-label="Example"><button class="close try" type="button" id="try-demo">Try the Demo</button><button class="close" type="button" data-close>Close</button></dialog>
<dialog id="part" aria-label="Part"><div class="view"></div><figcaption></figcaption><button class="close" type="button" data-close>Close</button></dialog>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<!-- the Vocabulary is the system's own spatial UI library, live (system/editor/src/vocabulary.mjs): served with this page (by the system, npm start, or python3 -m http.server) -->
<script type="importmap">{"imports":{"three":"./system/editor/node_modules/three/build/three.module.js","three/addons/":"./system/editor/node_modules/three/examples/jsm/","three-mesh-bvh":"./system/editor/node_modules/three-mesh-bvh/build/index.module.js","harfbuzzjs":"./system/editor/node_modules/harfbuzzjs/dist/index.mjs"}}</script>
<script type="module">
import {createVocabulary,openVocabulary,VOCABULARY} from './system/editor/src/vocabulary.mjs';
window.VOCAB={view:createVocabulary(),open:openVocabulary,parts:VOCABULARY};dispatchEvent(new Event('vocabulary-ready'));
</script>
<script src="media/gallery/examples.js"></script>
<script src="context/about/abstract.js"></script>
<script>
const GAL='media/gallery/';   // the Gallery's examples and their stills (system/editor/scripts/gallery.py writes them)
const MODS=["Answer while typing", "Weather", "FindMy", "WorldInfo", "LabInfo", "IoTControl", "ObjectStatus", "Wayfinding", "Send", "Agenda", "BookCompanion", "StepGuide", "LiveCoach", "Reminder"];
// Spatial vocabulary (context/docs/modos-system-design.md 4.4): category → row → part
const CATS=[{"id": "cues", "name": "Cues", "def": "Drawn on the room itself.", "rows": [{"name": "Mark", "def": "highlighting a physical entity", "items": [{"img": "breathingBox", "name": "Breathing Box", "use": "Draws the eye to a thing.", "eg": "FindMy"}, {"img": "cornerBrackets", "name": "Corner Brackets", "use": "Marks a thing without covering its content.", "eg": "WorldInfo"}, {"img": "footprintRing", "name": "Footprint Ring", "use": "Shows which thing is being operated.", "eg": "IoTControl"}, {"img": "floorArea", "name": "Floor Area", "use": "Shows a room or area; a place has no box.", "eg": "LabInfo"}, {"img": "doorwayGlow", "name": "Doorway Glow", "use": "Shows where to enter another room.", "eg": "Wayfinding"}]}, {"name": "Guidance", "def": "leading to somewhere", "items": [{"img": "arrowAhead", "name": "Arrow Ahead", "use": "Turns you toward a target in this room.", "eg": "FindMy"}, {"img": "floorPath", "name": "Floor Path", "use": "Leads along a route to another room.", "eg": "Wayfinding"}, {"img": "textArrow", "name": "Text Arrow", "use": "Links text to the thing it is about.", "eg": "WorldInfo"}]}, {"name": "Visualization", "def": "visualizing information", "items": [{"img": "haloDial", "name": "Gauge", "use": "How much: a level with a range.", "eg": "IoTControl"}, {"img": "progressRail", "name": "Progress Rail", "use": "A task’s progress and time left.", "eg": "IoTControl"}, {"img": "pinnedTags", "name": "Pinned Tags", "use": "Several readings of one thing.", "eg": "IoTControl"}, {"img": "statusPulse", "name": "Status Pulse", "use": "A state, and why.", "eg": "ObjectStatus"}, {"img": "cardStack", "name": "Card Stack", "use": "What waits in line.", "eg": "IoTControl"}]}, {"name": "Controls", "def": "what the user acts on: sent on change, on Send, or never", "items": [{"img": "edgeBar", "name": "Slider", "use": "Sets a level; sent on release."}, {"img": "choice", "name": "Choice", "use": "Picks one option: a few in a row, more in a dropdown."}, {"img": "iconButton", "name": "Icon Button", "use": "Does one thing in one press."}, {"img": "textButton", "name": "Text Button", "use": "A command no preset fits."}, {"img": "textInput", "name": "Text Input", "use": "Text to edit before it is sent."}, {"img": "arPhoto", "name": "AR Photo", "use": "The photo about to be sent."}, {"img": "datePicker", "name": "Date Picker", "use": "Moves between days; nothing sent."}, {"img": "playback", "name": "Playback", "use": "Plays through time; nothing sent."}]}]}, {"id": "text", "name": "Text", "def": "How the words appear.", "rows": [{"name": "", "def": "one per answer, by rule", "items": [{"img": "embeddedText", "name": "Embedded Text", "use": "Written on a surface that reads well.", "eg": "Weather"}, {"img": "floatingText", "name": "Floating Text", "use": "Beside its anchor when no surface fits.", "eg": "IoTControl"}, {"img": "dialogue", "name": "Object-centric Dialogue", "use": "The thing answers, when asked as “you”.", "eg": "WorldInfo"}]}]}, {"id": "assets", "name": "Assets", "def": "A MOD’s own; not shared.", "rows": [{"name": "", "def": "", "items": [{"img": "ambientEffect", "name": "Ambient Asset", "use": "The data as part of the room: sky, rain, fog.", "eg": "Weather"}, {"img": "asset", "name": "Scene Asset", "use": "A prepared model or animation, in place.", "eg": "LabInfo"}]}]}];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
// A part: its scene (live: the library's own part in an example room, drawn by system/editor/src/vocabulary.mjs), name and one line.
const part=i=>`<figure class="part"><button class="scene" type="button" data-part="${esc(i.img)}" aria-label="Open ${esc(i.name)}"></button><figcaption><b>${esc(i.name)}</b><p>${esc(i.use)}</p></figcaption></figure>`;
// A group of a category (Mark, Guidance, Visualization, Controls): a large heading, then its parts, or its own rows under smaller
// headings.
const GROUP_ICON={Mark:'scan',Guidance:'navigation',Visualization:'gauge',Controls:'sliders-horizontal'};
const gh=g=>`<h2>${GROUP_ICON[g.name]?`<i data-lucide="${GROUP_ICON[g.name]}" aria-hidden="true"></i>`:''}${esc(g.name)}</h2>`;
const group=g=>g.rows?`<section class="group"><div class="group-head pad">${gh(g)}${g.def?`<p>${esc(g.def)}</p>`:''}</div>${g.rows.map(r=>row(r.name,r.def,r.items.map(part))).join('')}</section>`
  :g.name?`<section class="group"><div class="group-head pad">${gh(g)}${g.def?`<p>${esc(g.def)}</p>`:''}</div><div class="strip pad">${g.items.map(part).join('')}</div></section>`
  :row('',g.def,g.items.map(part));
// One row: its name and what it is for, then its parts side by side.
const row=(name,def,cards)=>`<section class="row"><div class="row-head pad">${name?`<h3>${esc(name)}</h3>`:''}${def?`<p>${esc(def)}</p>`:''}</div><div class="strip pad">${cards.join('')}</div></section>`;
// The scenes: drawn live once the library has loaded (a page opened as a file cannot load it: then a note in each).
let closePart=null;
function wireRows(root){
  const V=window.VOCAB;
  for(const b of root.querySelectorAll('[data-part]')){const id=b.dataset.part,name=b.closest('.part').querySelector('b').textContent;
    if(!V||!V.parts.includes(id)){b.classList.add('off');b.textContent=location.protocol==='file:'?'Serve this folder to see it live (python3 -m http.server).':'Loading…';continue;}
    b.classList.remove('off');b.textContent='';V.view.tile(b,id);
    b.onclick=()=>{const d=$('part');d.querySelector('figcaption').innerHTML=`<b>${esc(name)}</b>${esc(b.closest('.part').querySelector('p').textContent)}`;d.showModal();closePart=V.open(d.querySelector('.view'),id);};}
}
$('part').addEventListener('close',()=>{closePart?.();closePart=null;});
addEventListener('vocabulary-ready',()=>{if(tab==='vocabulary')render();});
// Sections with tabs at their top (Vocabulary: its categories; About: Memory, Decisions…): a tab is an id, a name and what it renders.
const tabsBar=(sec,list,on)=>`<nav class="tabs pad" role="tablist" aria-label="${sec}">${list.map(x=>`<button type="button" role="tab" data-sub="${x.id}" aria-selected="${x.id===on}">${esc(x.name)}</button>`).join('')}</nav>`;
const SUBS={
  vocabulary:CATS.map(c=>({id:c.id,name:c.name,render:()=>`<div class="cat-${c.id}"><p class="lead pad">${esc(c.def)}</p>${c.rows.map(group).join('')}</div>`})),
  // About: ModOS, the project's introduction (the paper's Abstract, synced by system/editor/scripts/about.py); Walkthrough, the
  // pipeline page (every decision of a question), live from the system
  about:[{id:'modos',name:'ModOS',render:()=>`<div class="intro pad">${(window.ABOUT?.abstract||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`},
    {id:'walkthrough',name:'Walkthrough',render:()=>'<div class="walk"></div>',after:showWalk}],
};
const TABS=['demo','gallery','vocabulary','about'];
let tab='demo';const sub={vocabulary:SUBS.vocabulary[0].id,about:SUBS.about[0].id};
function route(){const [t,u]=location.hash.slice(1).split('/');tab=TABS.includes(t)?t:'demo';if(SUBS[tab]?.some(x=>x.id===u))sub[tab]=u;render();}
function go(t,u=sub[t]){location.hash=SUBS[t]?`${t}/${u}`:t;}
function render(){
  for(const b of $('nav').children)b.setAttribute('aria-pressed',String(b.dataset.tab===tab));
  for(const t of TABS)$(t).hidden=tab!==t;document.body.classList.toggle('dark',tab==='demo');document.body.classList.toggle('walkthrough',tab==='about'&&sub.about==='walkthrough');if(tab==='demo')showDemo();
  if(SUBS[tab]){const el=$(tab),cur=SUBS[tab].find(x=>x.id===sub[tab]);el.innerHTML=tabsBar(tab,SUBS[tab],cur.id)+cur.render();
    for(const b of el.querySelectorAll('[data-sub]'))b.onclick=()=>go(tab,b.dataset.sub);wireRows(el);cur.after?.(el);try{window.lucide?.createIcons({attrs:{'stroke-width':1.75}});}catch{}}
}
for(const b of $('nav').children)b.onclick=()=>go(b.dataset.tab);
addEventListener('hashchange',()=>{route();scrollTo(0,0);});
// Demo: ModOS itself, live: the editor (system/editor), framed, with its API from the system that serves this page (npm start there),
// on the lab recording. The page's own query is the Demo's (the editor opened on its own comes here with what it was given).
const SYSTEM='system/editor/',SESSION='./spaces/atlas/scenarios/atlas_rec_5/session.json',GIVEN=new URLSearchParams(location.search);
// whether ModOS runs here (served statically, the page has no API: the Demo and the examples need it)
const running=()=>fetch('api/spaces',{cache:'no-store'}).then(r=>r.ok,()=>false);
// the Demo's camera in its full window: the page's bottom switch steps aside meanwhile (a message from the editor, src/app.mjs)
addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='modos-camera-full')document.body.classList.toggle('demo-full',!!e.data.on);});
let demoShown=false,demoAt=null;
// at: {session, t} to open the Demo on (Try the Demo from a Gallery example: its recording, at its question's moment)
async function showDemo(at=null){
  if(at){demoAt=at;demoShown=false;}if(demoShown)return;demoShown=true;
  const q=demoAt?new URLSearchParams({session:demoAt.session,...(demoAt.t!=null?{t:String(demoAt.t)}:{})}):new URLSearchParams(GIVEN);
  if(!q.has('session'))q.set('session',SESSION);
  if(await running())$('demo').innerHTML=`<iframe src="${SYSTEM}?${q}" title="ModOS" allow="autoplay; fullscreen; microphone"></iframe>`;
  else{demoShown=false;$('demo').innerHTML=`<p>ModOS is not running. Start it with <code>cd system/editor && npm start</code>, then open Demo again.</p>`;}
}
// Walkthrough: the pipeline page on a question of the lab recordings (it falls back to the newest one with a decision record)
const WALK=new URLSearchParams({session:'./spaces/atlas/scenarios/atlas_rec_1/session.json',conversation:'20261120-003639-1795160199664955000',q:'104'});
// its top is the tab row's line (the Walkthrough tab's underline)
const walkTop=()=>{const n=document.querySelector('#about .tabs [aria-selected="true"]');if(n)document.documentElement.style.setProperty('--walk-top',n.getBoundingClientRect().bottom+'px');};
addEventListener('resize',walkTop);
async function showWalk(el){const w=el.querySelector('.walk');if(!w)return;walkTop();
  w.innerHTML=await running()?`<iframe src="${SYSTEM}pipeline.html?${WALK}" title="Walkthrough: the pipeline"></iframe>`:'<p>The walkthrough is the running system\'s pipeline. Start it with <code>cd system/editor && npm start</code>, then open Walkthrough again.</p>';}
// Gallery: a masonry of MODs (Lucide icon, name, how many; a line on the left to their examples). An example is a question asked in
// ModOS (system/editor/scripts/gallery.py): its question (or questions, asked one after another) above a still of the camera view at its answer. Opened, ModOS shows it live in
// its example view (the camera, the player and the pipeline), played only; Try the Demo opens the Demo on its recording at that moment.
// demos/gallery.mjs asks them all again as a queue.
const ICON={'Answer while typing':'zap',Weather:'cloud-sun',FindMy:'search',WorldInfo:'info',LabInfo:'flask-conical',IoTControl:'lightbulb',ObjectStatus:'activity',
  Wayfinding:'signpost',Send:'send',Agenda:'calendar',BookCompanion:'book-open',StepGuide:'list-ordered',LiveCoach:'person-standing',Reminder:'bell'};
let examples=[];
function renderExamples(){
  if(!examples.length){$('gallery').innerHTML='<p class="pad">No examples yet. Ask them with <code>npm run gallery</code> in system/editor.</p>';return;}
  $('gallery').innerHTML=`<div class="masonry pad">${MODS.filter(m=>examples.some(c=>c.mod===m)).map(m=>{const own=examples.filter(c=>c.mod===m);
    return `<section class="mod"><h2><i data-lucide="${ICON[m]||'box'}" aria-hidden="true"></i>${esc(m)}<span class="n">${own.length}</span></h2>${own.map(c=>`<button class="clip" type="button" data-example="${esc(c.name)}">
      ${(c.questions||[c.question]).map(q=>`<span class="q">“${esc(q)}”</span>`).join('')}<span class="cam">${c.still?`<img src="${GAL}${esc(c.still)}?v=${c.still_at}" alt="" loading="lazy">`:''}</span></button>`).join('')}</section>`;}).join('')}</div>`;
  try{window.lucide?.createIcons({attrs:{'stroke-width':1.75}});}catch{}
  for(const b of document.querySelectorAll('[data-example]'))b.onclick=()=>openExample(examples.find(x=>x.name===b.dataset.example));
}
async function openExample(c){
  const d=$('example');for(const x of d.querySelectorAll('iframe,p'))x.remove();
  if(await running())d.insertAdjacentHTML('afterbegin',`<iframe src="${SYSTEM}?${new URLSearchParams({session:c.session,conversation:c.conversation,example:c.name})}" title="${esc(c.question)}" allow="autoplay; fullscreen; microphone"></iframe>`);
  else d.insertAdjacentHTML('afterbegin','<p>ModOS is not running. Start it with <code>cd system/editor && npm start</code>, then open the example again.</p>');
  // Try the Demo: ModOS itself on this example's recording, at the moment its (first) question was asked
  $('try-demo').onclick=()=>{d.close();showDemo({session:c.session,t:Math.max(0,(c.first_t??c.t??0)-.5)});location.hash='demo';};
  d.showModal();
}
// After an example was asked again or deleted there, read the examples anew (the editor's server rewrote them).
async function reloadExamples(){try{examples=(await (await fetch(GAL+'examples.json',{cache:'no-store'})).json()).examples;renderExamples();}catch{}}
$('example').addEventListener('close',()=>{for(const x of $('example').querySelectorAll('iframe'))x.remove();reloadExamples();});
for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{if(e.target===d||e.target.dataset.close!==undefined)d.close();});
examples=window.GALLERY?.examples||[];renderExamples();if(!window.GALLERY)reloadExamples();
route();
// an example asked for (the editor's example view opened on its own): the Gallery, with it open
if(GIVEN.has('example')){const c=examples.find(x=>x.name===GIVEN.get('example'));if(c)openExample(c);}
</script>
